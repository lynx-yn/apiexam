<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random User Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-4">
    <h1 class="text-center mb-4">Random User Generator</h1>

    <div class="d-flex justify-content-center gap-2 mb-4">
      <input type="number" id="count" class="form-control w-auto" value="1" min="1" max="10">
      <button id="btn" class="btn btn-primary">Get Users</button>
    </div>

    <p id="message" class="text-center"></p>

    <div id="users" class="row"></div>
  </div>

  <script>
    var btn = document.getElementById("btn");
    var countInput = document.getElementById("count");
    var message = document.getElementById("message");
    var usersDiv = document.getElementById("users");

    async function getUsers() {
      var count = countInput.value;
      message.innerText = "Loading...";
      usersDiv.innerHTML = "";

      try {
        var response = await fetch("https://randomuser.me/api/?results=" + count);
        var data = await response.json();
        showUsers(data.results);
        message.innerText = "";
      } catch (error) {
        message.innerText = "Something went wrong. Try again.";
        console.log(error);
      }
    }

    function showUsers(users) {
      var html = "";
      for (var i = 0; i < users.length; i++) {
        var user = users[i];
        html += '<div class="col-md-4 mb-3">';
        html += '<div class="card text-center p-3">';
        html += '<img src="' + user.picture.large + '" class="rounded-circle mx-auto mb-2" width="100" height="100">';
        html += '<h5>' + user.name.first + ' ' + user.name.last + '</h5>';
        html += '<p class="mb-1">Email: ' + user.email + '</p>';
        html += '<p class="mb-1">Location: ' + user.location.city + ', ' + user.location.country + '</p>';
        html += '<p class="mb-0">Phone: ' + user.phone + '</p>';
        html += '</div>';
        html += '</div>';
      }
      usersDiv.innerHTML = html;
    }

    btn.addEventListener("click", getUsers);
  </script>
</body>
</html>
